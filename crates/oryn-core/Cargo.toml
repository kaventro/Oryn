[package]
name = "oryn-core"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
cap-std = "4.0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
diffy = "0.5"
dirs = "6"
filetime = "0.2"
flate2 = "1.1.9"
hex = "0.4"
globset = "0.4"
libc = "0.2"
notify = "8"
parking_lot = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ssh2 = "0.9"
tar = "0.4.45"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tracing = "0.1"
trash = "5"
walkdir = "2"
zip = { version = "8", default-features = false, features = ["deflate", "aes-crypto"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "ogg", "vorbis", "isomp4", "aac"] }
matroska = "0.30"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
md-5 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
