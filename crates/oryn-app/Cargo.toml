[package]
name = "oryn-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oryn"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
oryn-core = { path = "../oryn-core" }
alacritty_terminal = "0.26"
portable-pty = "0.9"
futures = "0.3"
parking_lot = "0.12"
open = "5"
rust-embed = "8"
ureq = "3"
serde_json = "1"
rodio = { version = "0.23", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
