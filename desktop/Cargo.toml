[package]
name = "Oryn"
version = "0.0.3"
description = "Oryn — a modern, keyboard-driven dual-pane file manager"
authors = ["Kaventro"]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/kaventro/Oryn"
homepage = "https://github.com/kaventro/Oryn"
keywords = ["file-manager", "dual-pane", "tauri", "desktop"]
categories = ["filesystem", "gui"]

[lib]
name = "oryn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "protocol-asset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "process", "io-util", "fs"] }
walkdir = "2"
regex = "1"
trash = "5"
anyhow = "1"
parking_lot = "0.12"
diffy = "0.5"
globset = "0.4"
dirs = "6"
arboard = "3"
opener = "0.8"
once_cell = "1"
rfd = "0.15"
sysinfo = "0.38.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4.45"
image = { version = "0.25", default-features = false, features = ["png"] }
flate2 = "1.1.9"
filetime = "0.2"
sha2 = "0.11"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
ssh2 = "0.9"
notify = "8"
cap-std = "4.0.3"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[target."cfg(windows)".dependencies]
win32job = "2.0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = 3
