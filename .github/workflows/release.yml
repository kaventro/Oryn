name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.0.4 or 4). Leave blank for auto +1 (0.0.3 -> 0.0.4)'
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 1. Create a single draft release up front so all platforms upload into the
  #    same release. Nothing is public yet.
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag_name: ${{ steps.version-step.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version & bump files
        id: version-step
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          node -e '
            const fs = require("fs");

            const isTag = Boolean(process.env.GITHUB_REF && process.env.GITHUB_REF.startsWith("refs/tags/"));
            if (isTag) {
              const tag = process.env.GITHUB_REF.replace(/^refs\/tags\//, "");
              const version = tag.replace(/^v/, "");
              console.log(`Triggered by tag push: ${tag} (version ${version})`);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nversion=${version}\nshould_commit=false\n`);
              process.exit(0);
            }

            const pkgPath = "./package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const currentVersion = pkg.version || "0.0.1";
            let input = (process.env.INPUT_VERSION || "").trim().replace(/^v/, "");

            let newVersion = "";
            if (input) {
              if (/^\d+$/.test(input)) {
                const parts = currentVersion.split(".");
                while (parts.length < 2) parts.push("0");
                newVersion = `${parts[0]}.${parts[1]}.${input}`;
              } else if (/^\d+\.\d+(\.\d+)?(-[\w.]+)?$/.test(input)) {
                const parts = input.split(".");
                newVersion = parts.length === 2 ? `${input}.0` : input;
              } else {
                console.error(`Invalid version format: "${input}"`);
                process.exit(1);
              }
            } else {
              const parts = currentVersion.split(".");
              const major = parts[0] || "0";
              const minor = parts[1] || "0";
              const patch = parseInt(parts[2] || "0", 10);
              newVersion = `${major}.${minor}.${patch + 1}`;
            }

            const tag = `v${newVersion}`;
            console.log(`Current version: ${currentVersion}`);
            console.log(`Target release version: ${newVersion} (${tag})`);

            // 1. package.json
            pkg.version = newVersion;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

            // 2. package-lock.json
            const lockPath = "./package-lock.json";
            if (fs.existsSync(lockPath)) {
              const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
              lock.version = newVersion;
              if (lock.packages && lock.packages[""]) {
                lock.packages[""].version = newVersion;
              }
              fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + "\n");
            }

            // 3. desktop/tauri.conf.json
            const tauriPath = "./desktop/tauri.conf.json";
            if (fs.existsSync(tauriPath)) {
              const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
              tauri.version = newVersion;
              fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");
            }

            // 4. desktop/Cargo.toml
            const cargoPath = "./desktop/Cargo.toml";
            if (fs.existsSync(cargoPath)) {
              let cargo = fs.readFileSync(cargoPath, "utf8");
              cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${newVersion}"`);
              fs.writeFileSync(cargoPath, cargo);
            }

            // 5. desktop/Cargo.lock
            const cargoLockPath = "./desktop/Cargo.lock";
            if (fs.existsSync(cargoLockPath)) {
              let cargoLock = fs.readFileSync(cargoLockPath, "utf8");
              cargoLock = cargoLock.replace(/(\[\[package\]\]\r?\nname = "Oryn"\r?\nversion = )"[^"]*"/, `$1"${newVersion}"`);
              fs.writeFileSync(cargoLockPath, cargoLock);
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nversion=${newVersion}\nshould_commit=true\n`);
          '

      - name: Commit, push and tag
        if: steps.version-step.outputs.should_commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json desktop/tauri.conf.json desktop/Cargo.toml desktop/Cargo.lock
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): ${{ steps.version-step.outputs.tag }}"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
          git tag -f ${{ steps.version-step.outputs.tag }}
          git push origin ${{ steps.version-step.outputs.tag }} --force

      - name: Create draft release
        id: create-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = '${{ steps.version-step.outputs.tag }}';
            // find-or-create so re-running a failed release reuses the draft
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (e) {
              if (e.status !== 404) throw e;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `Oryn ${tag}`,
                draft: true, prerelease: false,
              })).data;
            }
            return release.id;

  # 2. Build every platform (macOS, Windows, Linux) and upload into draft release.
  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--bundles app,dmg'
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: 'desktop -> desktop/target'
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & upload to draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          tagName: ${{ needs.create-release.outputs.tag_name }}

      # Also ship the raw portable exe (no installer) for Windows.
      - name: Upload portable exe (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DEST="Oryn_${VERSION}_x64.exe"
          if [ -f desktop/target/release/Oryn.exe ]; then
            cp desktop/target/release/Oryn.exe "$DEST"
          else
            echo "portable exe not found:"; ls -la desktop/target/release/*.exe; exit 1
          fi
          gh release upload "${{ needs.create-release.outputs.tag_name }}" "$DEST" --clobber --repo "$GITHUB_REPOSITORY"

  # 3. Only once EVERY platform succeeded, flip the draft to published.
  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # The updater fetches releases/latest/download/latest.json. tauri-action writes
      # one latest.json per matrix job, so build the merged manifest from the signed
      # artifacts already sitting on the draft release.
      - name: Build updater manifest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = ${{ needs.create-release.outputs.release_id }};
            const tag = '${{ needs.create-release.outputs.tag_name }}';
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id, per_page: 100,
            });

            const targets = [
              ['darwin-aarch64', (n) => n.endsWith('.app.tar.gz')],
              ['windows-x86_64', (n) => n.endsWith('-setup.exe')],
              ['linux-x86_64', (n) => n.endsWith('.AppImage')],
            ];

            const platforms = {};
            for (const [key, match] of targets) {
              const bundle = assets.find((a) => match(a.name) && !a.name.endsWith('.sig'));
              const sig = bundle && assets.find((a) => a.name === `${bundle.name}.sig`);
              if (!bundle || !sig) {
                core.warning(`no signed updater artifact for ${key}`);
                continue;
              }
              const raw = await github.request(
                'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
                { owner, repo, asset_id: sig.id, headers: { accept: 'application/octet-stream' } },
              );
              platforms[key] = {
                signature: Buffer.from(raw.data).toString('utf8').trim(),
                url: `https://github.com/${owner}/${repo}/releases/download/${tag}/${encodeURIComponent(bundle.name)}`,
              };
            }
            if (Object.keys(platforms).length === 0) {
              throw new Error('no signed updater artifacts found — is TAURI_SIGNING_PRIVATE_KEY set?');
            }

            const manifest = {
              version: tag.replace(/^v/, ''),
              pub_date: new Date().toISOString(),
              notes: `https://github.com/${owner}/${repo}/releases/tag/${tag}`,
              platforms,
            };

            // Re-runs must not collide with a manifest from a previous attempt.
            const stale = assets.find((a) => a.name === 'latest.json');
            if (stale) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: stale.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: 'latest.json',
              data: JSON.stringify(manifest, null, 2),
            });
            core.info(`latest.json covers: ${Object.keys(platforms).join(', ')}`);

      - name: Publish release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              prerelease: false,
            });
